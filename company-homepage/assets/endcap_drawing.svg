<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <defs>
    <pattern id="hh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#e3e7ef"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a94a8" stroke-width="1.2"/>
    </pattern>
    <pattern id="mh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="4" height="4" fill="#f4f6fa"/><line x1="0" y1="0" x2="0" y2="4" stroke="#1f2a44" stroke-width="1.2"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker>
  </defs>

  <!-- 왼쪽: 하우징에 끼운 모습 (축이 지나가지 않는 막힌 구멍) -->
  <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">조립·설치도</text>
  <!-- 하우징 (위·아래 단면) -->
  <path d="M40,40 H270 V100 L262,108 H40 Z" fill="url(#hh)" stroke="#1f2a44" stroke-width="1.6"/>
  <path d="M40,260 H270 V200 L262,192 H40 Z" fill="url(#hh)" stroke="#1f2a44" stroke-width="1.6"/>
  <!-- 구멍 안쪽 (기름 쪽) -->
  <rect x="40" y="108" width="190" height="84" fill="#fff8ec"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" fill="#b4532a">구멍 안쪽 (기름 쪽)</text>
  <!-- 엔드캡: 금속 컵 + 고무 외주 -->
  <path d="M228,108 H264 V113 H236 V187 H264 V192 H228 Z" fill="#3f63d8" stroke="#1f2a44" stroke-width="1.4"/>
  <path d="M236,113 H262 V117 H241 V183 H262 V187 H236 Z" fill="url(#mh)" stroke="#1f2a44" stroke-width="1.2"/>
  <!-- 중심선 -->
  <line x1="30" y1="150" x2="300" y2="150" stroke="#1f2a44" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <!-- 장착 깊이 B+0.5 -->
  <line x1="228" y1="40" x2="228" y2="26" stroke="#1f2a44" stroke-width="1"/>
  <line x1="270" y1="40" x2="270" y2="26" stroke="#1f2a44" stroke-width="1"/>
  <line x1="231" y1="30" x2="267" y2="30" stroke="#1f2a44" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="249" y="24" text-anchor="middle" font-size="12" fill="#1f2a44">B+0.5</text>
  <!-- 모따기 10°~20° -->
  <line x1="270" y1="100" x2="300" y2="84" stroke="#1f2a44" stroke-width="1"/>
  <text x="304" y="84" font-size="12" fill="#1f2a44">10°~20° 모따기</text>
  <!-- 구멍 지름 A (H8) -->
  <line x1="290" y1="108" x2="320" y2="108" stroke="#1f2a44" stroke-width="1"/>
  <line x1="290" y1="192" x2="320" y2="192" stroke="#1f2a44" stroke-width="1"/>
  <line x1="314" y1="111" x2="314" y2="189" stroke="#1f2a44" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="322" y="155" font-size="13" fill="#1f2a44">A (H8)</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#5a6782">하우징 바깥 면</text>
  <line x1="270" y1="262" x2="270" y2="272" stroke="#5a6782" stroke-width="1"/>

  <!-- 오른쪽: 엔드캡 단면 치수 -->
  <text x="530" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">단면 치수</text>
  <path d="M500,60 H540 V67 H510 V233 H540 V240 H500 Z" fill="#3f63d8" stroke="#1f2a44" stroke-width="1.4"/>
  <path d="M510,67 H537 V72 H516 V228 H537 V233 H510 Z" fill="url(#mh)" stroke="#1f2a44" stroke-width="1.2"/>
  <line x1="480" y1="150" x2="560" y2="150" stroke="#1f2a44" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <!-- B -->
  <line x1="500" y1="60" x2="500" y2="44" stroke="#1f2a44" stroke-width="1"/>
  <line x1="540" y1="60" x2="540" y2="44" stroke="#1f2a44" stroke-width="1"/>
  <line x1="503" y1="48" x2="537" y2="48" stroke="#1f2a44" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="520" y="40" text-anchor="middle" font-size="12" fill="#1f2a44">B ±0.2</text>
  <!-- A -->
  <line x1="540" y1="60" x2="590" y2="60" stroke="#1f2a44" stroke-width="1"/>
  <line x1="540" y1="240" x2="590" y2="240" stroke="#1f2a44" stroke-width="1"/>
  <line x1="584" y1="63" x2="584" y2="237" stroke="#1f2a44" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="592" y="155" font-size="13" fill="#1f2a44">A</text>
  <!-- 범례 -->
  <rect x="440" y="262" width="12" height="10" fill="#3f63d8" stroke="#1f2a44"/><text x="456" y="271" font-size="11" fill="#1f2a44">고무</text>
  <rect x="492" y="262" width="12" height="10" fill="url(#mh)" stroke="#1f2a44"/><text x="508" y="271" font-size="11" fill="#1f2a44">금속 컵</text>
  <rect x="560" y="262" width="12" height="10" fill="url(#hh)" stroke="#1f2a44"/><text x="576" y="271" font-size="11" fill="#1f2a44">하우징</text>
  <text x="330" y="160" text-anchor="middle" font-size="40" font-weight="700" fill="#2e3c58" fill-opacity="0.12" transform="rotate(-18 330 150)">SWS TECH</text>
</svg>
