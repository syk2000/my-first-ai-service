<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>SWS 이용 통계</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f5f7fb; --surface: #fff; --text: #1d2533; --muted: #667085; --line: #e3e8f0;
    --accent: #e8892b; --accent-soft: #fbe3cb; --navy: #1f3a68; --navy-soft: #d6e0f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Noto Sans KR", system-ui, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .range { display: flex; gap: 6px; flex-wrap: wrap; }
  .range button { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  .range button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  td.rank { width: 26px; color: var(--muted); text-align: right; padding-right: 8px; }
  td.name { word-break: break-all; }
  td.name small { color: var(--muted); display: block; font-size: 11.5px; }
  td.bar { width: 38%; }
  td.cnt { width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .b { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .b.navy { background: var(--navy); }
  .empty { color: var(--muted); padding: 10px 0; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #daily { width: 100%; overflow-x: auto; }
  #daily svg { display: block; }
  .msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SWS 이용 통계</h1>
      <div class="sub" id="period">불러오는 중…</div>
    </div>
    <div class="range" id="range">
      <button data-d="7">7일</button><button data-d="30" class="on">30일</button><button data-d="90">90일</button><button data-d="365">1년</button>
    </div>
  </header>
  <div id="out"><div class="msg">불러오는 중…</div></div>
  <p class="note">홈페이지(sws-bearing.com)와 카카오톡 챗봇 이용을 익명으로 모은 통계입니다.<br>IP·카카오 사용자 ID·쿠키는 저장하지 않으며, 전화번호·메일 주소로 보이는 글자는 지우고 저장합니다.<br>견적·발주 양식에 적힌 회사명·연락처는 기록하지 않습니다.</p>
</div>
<script src="../assets/spec-data.js?v=20261125re"></script>
<script>
(function () {
  var out = document.getElementById("out");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var num = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };

  function rank(title, desc, rows, opt) {
    opt = opt || {};
    var max = rows.reduce(function (m, r) { return Math.max(m, r.cnt); }, 0) || 1;
    var body = rows.length ? "<table>" + rows.map(function (r, i) {
      return "<tr><td class='rank'>" + (i + 1) + "</td><td class='name'>" + esc(opt.label ? opt.label(r) : r.k) +
        (opt.sub && opt.sub(r) ? "<small>" + esc(opt.sub(r)) + "</small>" : "") + "</td><td class='bar'><div class='b" + (opt.navy ? " navy" : "") +
        "' style='width:" + Math.max(2, Math.round(r.cnt / max * 100)) + "%'></div></td><td class='cnt'>" + num(r.cnt) + "</td></tr>";
    }).join("") + "</table>" : "<div class='empty'>아직 기록이 없습니다.</div>";
    return "<section class='card" + (opt.wide ? " wide" : "") + "'><h2>" + esc(title) + "</h2><p class='desc'>" + esc(desc) + "</p>" + body + "</section>";
  }

  function daily(rows, days) {
    var map = {};
    rows.forEach(function (r) { (map[r.day] = map[r.day] || { web: 0, kakao: 0 })[r.src] = r.cnt; });
    var list = [];
    var now = new Date(Date.now() + 9 * 3600 * 1000);
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400 * 1000).toISOString().slice(0, 10);
      list.push({ day: d, web: (map[d] || {}).web || 0, kakao: (map[d] || {}).kakao || 0 });
    }
    var max = list.reduce(function (m, r) { return Math.max(m, r.web, r.kakao); }, 0) || 1;
    var step = Math.max(1, Math.ceil(max / 4));
    max = step * Math.ceil(max / step);
    var W = Math.max(600, (out.clientWidth || 1100) - 36), H = 200, pad = 34, bw = (W - pad) / list.length;
    var every = Math.max(1, Math.ceil(list.length / Math.floor(W / 46)));
    var bars = list.map(function (r, i) {
      var x = pad + i * bw, w = Math.max(1, bw / 2 - 1);
      var hw = r.web / max * (H - 40), hk = r.kakao / max * (H - 40);
      var tip = r.day + " · 홈페이지 " + r.web + " · 카톡 " + r.kakao;
      var lab = ((list.length - 1 - i) % every === 0) ? "<text x='" + (x + bw / 2) + "' y='" + (H - 6) + "' font-size='10' text-anchor='middle' fill='#667085'>" + r.day.slice(5).replace("-", "/") + "</text>" : "";
      return "<g><title>" + tip + "</title><rect x='" + x + "' y='" + (H - 22 - hw) + "' width='" + w + "' height='" + hw + "' fill='#e8892b' rx='1'/>" +
        "<rect x='" + (x + w + 1) + "' y='" + (H - 22 - hk) + "' width='" + w + "' height='" + hk + "' fill='#1f3a68' rx='1'/></g>" + lab;
    }).join("");
    var ticks = [];
    for (var v = 0; v <= max; v += step) ticks.push(v);
    var grid = ticks.map(function (v) {
      var y = H - 22 - v / max * (H - 40);
      return "<line x1='" + pad + "' x2='" + W + "' y1='" + y + "' y2='" + y + "' stroke='#e3e8f0'/><text x='" + (pad - 6) + "' y='" + (y + 3) + "' font-size='10' text-anchor='end' fill='#667085'>" + v + "</text>";
    }).join("");
    return "<section class='card wide'><h2>날짜별 이용</h2><p class='desc'>홈페이지 페이지 열람 수와 카카오톡 챗봇 질문 수 (막대에 마우스를 올리면 숫자 표시)</p>" +
      "<div class='legend'><span><i style='background:#e8892b'></i>홈페이지 열람</span><span><i style='background:#1f3a68'></i>카톡 질문</span></div>" +
      "<div id='daily'><svg width='" + W + "' height='" + H + "'>" + grid + bars + "</svg></div></section>";
  }

  function groups(pages) {
    if (typeof PAGE_GROUP === "undefined") return [];
    var sum = {};
    pages.forEach(function (r) {
      var g = PAGE_GROUP[r.k + ".html"];
      if (g) sum[g] = (sum[g] || 0) + r.cnt;
    });
    return Object.keys(sum).map(function (k) { return { k: k, cnt: sum[k] }; }).sort(function (a, b) { return b.cnt - a.cnt; });
  }

  function render(d) {
    if (!d.ok) {
      out.innerHTML = "<div class='msg'>" + (d.reason === "locked" ? "로그인 확인이 되지 않았습니다. 이 페이지를 새로 고쳐 주세요." : d.reason === "no_db" ? "통계 저장소가 아직 연결되지 않았습니다." : "통계를 불러오지 못했습니다.") + "</div>";
      return;
    }
    document.getElementById("period").textContent = "최근 " + d.days + "일 · " + new Date().toLocaleString("ko-KR") + " 기준";
    if (d.empty) { out.innerHTML = "<div class='msg'>아직 기록이 없습니다. 손님이 사이트나 챗봇을 이용하면 여기에 쌓입니다.</div>"; return; }
    var tot = {};
    d.totals.forEach(function (r) { tot[r.src + ":" + r.t] = r.cnt; });
    var k = function (key) { return num(tot[key]); };
    var kakaoAll = ["kakao:ksearch", "kakao:kmenu", "kakao:kpick", "kakao:kform"].reduce(function (s, x) { return s + (tot[x] || 0); }, 0);
    var tiles = [
      ["홈페이지 열람", k("web:view")], ["홈페이지 검색", k("web:search")], ["견적 목록 담기", k("web:add")],
      ["문의 보내기", k("web:inq")], ["카톡·전화 버튼", num((tot["web:kakao"] || 0) + (tot["web:tel"] || 0))],
      ["카탈로그 다운로드", k("web:dl")], ["카톡 챗봇 질문", num(kakaoAll)], ["카톡 견적·발주 접수", k("kakao:kform")],
    ].map(function (t) { return "<div class='tile'><div class='n'>" + t[1] + "</div><div class='l'>" + t[0] + "</div></div>"; }).join("");
    var pageTitle = function (r) { return (r.c || r.k).replace(/\s*[|·-]\s*SWS.*$/i, "") || r.k; };
    out.innerHTML = "<div class='tiles'>" + tiles + "</div><div class='grid'>" +
      daily(d.daily, d.days) +
      rank("많이 본 제품 분류", "제품 페이지 열람을 분류별로 합친 수", groups(d.pages)) +
      rank("많이 본 페이지", "홈페이지에서 열린 페이지 순위", d.pages, { label: pageTitle, sub: function (r) { return r.k; } }) +
      rank("홈페이지 검색어", "검색창·규격표 검색에 입력한 형번·치수 (아래 작은 글씨: 평균 결과 수)", d.searches, { sub: function (r) { return r.hits != null ? "결과 평균 " + r.hits + "건" : ""; } }) +
      rank("견적 목록에 담은 품번", "검색 결과에서 [담기]를 누른 품번", d.adds, { sub: function (r) { return r.c; } }) +
      rank("카톡에서 찾은 형번·치수", "챗봇에 보낸 형번·치수 (아래 작은 글씨: 평균 결과 수)", d.kSearches, { navy: true, sub: function (r) { return r.hits != null ? "결과 평균 " + r.hits + "건" : ""; } }) +
      rank("카톡 견적·발주 버튼 품번", "챗봇 규격 카드에서 [견적 문의]·[발주 문의]를 누른 품번", d.kPicks, { navy: true }) +
      rank("카톡 메뉴·질문", "형번이 아닌 질문과 메뉴 (영업시간, 주소, 견적 등)", d.kMenus, { navy: true }) +
      rank("찾지 못한 검색어 (홈페이지)", "결과가 0건이었던 검색어 — 등록하면 좋은 규격 후보", d.webMisses) +
      rank("찾지 못한 검색어 (카톡)", "결과가 0건이었던 형번·치수 — 등록하면 좋은 규격 후보", d.kMisses, { navy: true }) +
      rank("들어온 경로", "다른 사이트에서 넘어온 곳 (네이버·구글 등)", d.referrers) +
      rank("카탈로그 다운로드", "내려받은 PDF 파일", d.downloads) +
      "</div>";
  }

  function load(days) {
    out.innerHTML = "<div class='msg'>불러오는 중…</div>";
    fetch("data?days=" + days, { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(render)
      .catch(function () { render({ ok: false }); });
  }
  document.getElementById("range").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    [].forEach.call(this.querySelectorAll("button"), function (x) { x.classList.toggle("on", x === b); });
    load(Number(b.getAttribute("data-d")));
  });
  load(30);
})();
</script>
</body>
</html>
